spring.application.name=backend

# Test database configuration using H2
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Test JWT configuration
jwt.secret=${TEST_JWT_SECRET:test-jwt-secret-key-for-testing-purposes-only}
jwt.expiration=86400000

# Test Stripe configuration - Use test key from environment or default for testing
stripe.secret=${TEST_STRIPE_SECRET:sk_test_test_key_for_testing_only}

# Test CORS configuration
app.cors.allowed-origins=http://localhost:3000